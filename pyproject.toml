[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biosim"
version = "0.1.0"
description = "Bioreactor mass-balance simulator (growth / product / substrate / oxygen models)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biosim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
